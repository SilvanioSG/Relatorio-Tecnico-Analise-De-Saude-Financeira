# .github/workflows/publish.yml
name: Atualizar e Publicar Relatório

on:
  push:
    branches: [main]
  workflow_dispatch:        # 👈 Habilita o BOTÃO "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Notebook e gerar HTML
        run: |
          jupyter nbconvert \
            --to html \
            --execute \
            --ExecutePreprocessor.timeout=600 \
            --output index.html \
            RelatorioTecnicoAnaliseDeSaudeFinanceira.ipynb

      - name: Preparar artefato do site
        run: |
          mkdir -p _site
          cp index.html _site/
          # copia o logo se existir (usado no header do notebook)
          [ -f SG_Site.png ] && cp SG_Site.png _site/ || true
          [ -f README.md ] && cp README.md _site/ || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
