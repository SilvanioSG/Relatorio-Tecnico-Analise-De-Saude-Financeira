name: Atualizar e Publicar Relatório

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'  # 👈 Roda de segunda a sexta às 19h (horário de Brasília)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar HTML do Notebook
        run: |
          jupyter nbconvert --to html --execute --no-input --no-prompt --template classic \
            --output index.html \
            RelatorioTecnicoAnaliseDeSaudeFinanceira.ipynb

      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f SG_Site.png ] && cp SG_Site.png _site/ || true

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
