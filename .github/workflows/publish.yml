name: Atualizar e Publicar Relatório

on:
  push:
    branches: [main]
  workflow_dispatch:        # 👈 Habilita o botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Notebook e gerar HTML
        run: |
          # Note que o output agora é apenas 'index' (sem o .html)
          jupyter nbconvert --to html --execute --no-input --no-prompt --template classic \
            --output index \
            RelatorioTecnicoAnaliseDeSaudeFinanceira.ipynb

      - name: Preparar artefato do site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f SG_Site.png ] && cp SG_Site.png _site/ || true
          # NÃO copiamos o README.md para evitar que o GitHub Pages o exiba no lugar do relatório
          echo "Arquivos na pasta de deploy:"
          ls -la _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
